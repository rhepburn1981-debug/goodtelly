<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Teleprompter 🎬</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red:    #e8394a;
    --yellow: #f5c842;
    --green:  #3ecf6e;
    --bg:     #0d0d0d;
    --card:   #1a1a1a;
    --border: #2e2e2e;
    --text:   #f0ece0;
    --muted:  #777;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ─── SETUP PAGE ─── */
  #setup {
    display: flex;
    flex-direction: column;
    padding: 28px 20px 40px;
    max-width: 700px;
    margin: 0 auto;
    width: 100%;
    gap: 18px;
  }

  /* hero banner */
  .hero {
    background: linear-gradient(135deg, #1a0a0a 0%, #1a1000 100%);
    border: 2px solid var(--red);
    border-radius: 20px;
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: "🎬";
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 52px;
    opacity: 0.15;
  }

  .hero-photo {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 3px solid var(--yellow);
    object-fit: cover;
    flex-shrink: 0;
    background: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
  }

  .hero-photo img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
  }

  .hero-text h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px;
    letter-spacing: 0.05em;
    color: var(--yellow);
    line-height: 1;
  }

  .hero-text p {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* sync status pill */
  #syncStatus {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    margin-top: 6px;
    background: rgba(255,255,255,0.06);
    color: var(--muted);
    transition: all 0.3s;
  }

  #syncStatus.saving  { background: rgba(245,200,66,0.15); color: var(--yellow); }
  #syncStatus.saved   { background: rgba(62,207,110,0.15); color: var(--green); }
  #syncStatus.remote  { background: rgba(232,57,74,0.2);   color: var(--red); }

  #syncStatus .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }

  /* remote-update banner */
  #remoteBanner {
    display: none;
    background: rgba(232,57,74,0.15);
    border: 1px solid var(--red);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 14px;
    color: var(--red);
    cursor: pointer;
    text-align: center;
    font-weight: 600;
  }

  #remoteBanner:active { opacity: 0.7; }

  /* textarea */
  #scriptInput {
    width: 100%;
    height: 240px;
    background: var(--card);
    color: var(--text);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 17px;
    line-height: 1.6;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
  }

  #scriptInput:focus { border-color: var(--yellow); }

  /* sliders section */
  .sliders-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .slider-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    width: 72px;
    flex-shrink: 0;
  }

  input[type="range"] {
    -webkit-appearance: none;
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    background: var(--yellow);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(245,200,66,0.4);
  }

  .val-badge {
    background: var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 13px;
    min-width: 34px;
    text-align: center;
    font-weight: 600;
  }

  /* start button */
  #startBtn {
    width: 100%;
    padding: 18px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 0.1em;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    box-shadow: 0 4px 20px rgba(232,57,74,0.4);
  }

  #startBtn:active { transform: scale(0.97); box-shadow: none; }

  /* ─── PROMPTER SCREEN ─── */
  #prompter {
    display: none;
    flex-direction: column;
    height: 100dvh;
    background: #000;
    overflow: hidden;
  }

  #scroll-track {
    flex: 1;
    overflow: hidden;
    position: relative;
    cursor: pointer;
  }

  #scroll-content {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 75dvh 36px 80dvh 36px;
    font-family: 'DM Sans', sans-serif;
    font-size: 52px;
    line-height: 1.5;
    color: #fff;
    white-space: pre-wrap;
    word-break: break-word;
    will-change: transform;
  }

  #tap-overlay {
    position: absolute;
    inset: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  #paused-label {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    color: rgba(245,200,66,0.7);
    pointer-events: none;
    display: none;
    letter-spacing: 0.1em;
  }

  /* controls bar */
  #controls-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px 18px;
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  .ctrl-btn {
    border: none;
    border-radius: 50px;
    padding: 9px 20px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }

  #pauseBtn   { background: var(--yellow); color: #000; }
  #restartBtn { background: var(--green);  color: #000; }
  #stopBtn    { background: #222; color: #fff; }

  .live-slider-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 100px;
  }

  .live-slider-row label { font-size: 11px; color: #666; white-space: nowrap; }

  /* ── Recording UI ── */
  #recIndicator {
    display: none;
    position: absolute;
    top: 16px; left: 16px;
    align-items: center;
    gap: 7px;
    background: rgba(0,0,0,0.65);
    border-radius: 20px;
    padding: 6px 12px;
    z-index: 10;
    pointer-events: none;
  }
  #recDot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--red);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.2} }
  #recLabel { font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:.1em; color:var(--red); }
  #recTimer  { font-size:13px; color:#ccc; font-variant-numeric:tabular-nums; }

  #cameraPreview {
    display: none;
    position: absolute;
    top: 16px; right: 16px;
    width: 90px; height: 90px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--yellow);
    z-index: 10;
    cursor: pointer;
    transform: scaleX(-1);
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }

  #downloadBanner {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 100;
    padding: 32px;
    text-align: center;
  }
  #downloadBanner h2 { font-family:'Bebas Neue',sans-serif; font-size:36px; color:var(--yellow); letter-spacing:.05em; }
  #downloadBanner p  { color:var(--muted); font-size:14px; max-width:280px; line-height:1.6; }
  #downloadLink {
    display: block;
    background: var(--green);
    color: #000;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: .08em;
    padding: 16px 40px;
    border-radius: 14px;
    text-decoration: none;
    box-shadow: 0 4px 20px rgba(62,207,110,0.4);
  }
  #dismissDownload { background:#222; color:#fff; border:none; border-radius:50px; padding:10px 24px; font-size:15px; cursor:pointer; }

  .record-row { display:flex; align-items:center; justify-content:space-between; padding:4px 0; }
  .record-row label { font-size:14px; font-weight:600; color:var(--text); cursor:pointer; }
  .toggle-switch { position:relative; width:46px; height:26px; }
  .toggle-switch input { opacity:0; width:0; height:0; }
  .toggle-slider { position:absolute; inset:0; background:#333; border-radius:26px; transition:background .2s; cursor:pointer; }
  .toggle-slider::before { content:''; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:transform .2s; }
  .toggle-switch input:checked + .toggle-slider { background:var(--red); }
  .toggle-switch input:checked + .toggle-slider::before { transform:translateX(20px); }
</style>
</head>

    <div id="recIndicator">
      <span id="recDot"></span>
      <span id="recLabel">REC</span>
      <span id="recTimer">0:00</span>
    </div>
    <video id="cameraPreview" autoplay muted playsinline></video>
  </div>

  <div id="downloadBanner">
    <h2>Recording ready!</h2>
    <p>Tap the button below to save your video to your phone.</p>
    <a id="downloadLink" href="#">⬇ Save Recording</a>
    <button id="dismissDownload">Done</button>
  </div>

  <div id="controls-bar">
    <button class="ctrl-btn" id="stopBtn">⏹ Stop &amp; Save</button>
    <button class="ctrl-btn" id="restartBtn">↺ Restart</button>

    <div class="live-slider-row">
      <label>Speed</label>
      <input type="range" id="speedLive" min="1" max="50" value="8">
    </div>
    <div class="live-slider-row">
      <label>Size</label>
      <input type="range" id="fontLive" min="28" max="96" value="52">
    </div>

    <button class="ctrl-btn" id="pauseBtn">⏸ Pause</button>
  </div>
</div>

<script>
  // ── Elements ──
  var setupEl     = document.getElementById('setup');
  var prompterEl  = document.getElementById('prompter');
  var contentEl   = document.getElementById('scroll-content');
  var tapOverlay  = document.getElementById('tap-overlay');
  var pausedLabel = document.getElementById('paused-label');
  var pauseBtn    = document.getElementById('pauseBtn');
  var restartBtn  = document.getElementById('restartBtn');
  var stopBtn     = document.getElementById('stopBtn');
  var speedSetup  = document.getElementById('speedSetup');
  var speedLive   = document.getElementById('speedLive');
  var fontSetup   = document.getElementById('fontSetup');
  var fontLive    = document.getElementById('fontLive');
  var speedValEl  = document.getElementById('speedVal');
  var fontValEl   = document.getElementById('fontVal');
  var scriptInput = document.getElementById('scriptInput');
  var syncStatus  = document.getElementById('syncStatus');
  var syncText    = document.getElementById('syncText');
  var remoteBanner = document.getElementById('remoteBanner');

  // ── State ──
  var scrollY   = 0;
  var paused    = false;
  var raf       = null;
  var lastTs    = null;
  var speed     = 8;
  var fontSize  = 52;
  var saveTimer = null;
  var lastRemoteScript = '';
  var lastLocalEditTs  = 0;
  var pollTimer = null;

  // ── Load persisted defaults ──
  (function loadDefaults() {
    var s = localStorage.getItem('tp_speed');
    var f = localStorage.getItem('tp_font');
    if (s) { speed = +s; speedSetup.value = s; speedLive.value = s; speedValEl.textContent = s; }
    if (f) { fontSize = +f; fontSetup.value = f; fontLive.value = f; fontValEl.textContent = f; }
  })();

  // ── Sync helpers ──
  function setSyncStatus(state, msg) {
    syncStatus.className = state;
    syncText.textContent = msg;
  }

  function saveScript(text) {
    setSyncStatus('saving', 'Saving…');
    fetch('/api/teleprompter', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ script: text, speed: speed, font_size: fontSize })
    }).then(function(r) { return r.json(); }).then(function(data) {
      lastRemoteScript = data.script;
      setSyncStatus('saved', 'Saved ✓');
      setTimeout(function() { setSyncStatus('', 'Synced'); }, 2000);
    }).catch(function() {
      setSyncStatus('', 'Save failed');
    });
  }

  function loadRemoteScript() {
    remoteBanner.style.display = 'none';
    scriptInput.value = lastRemoteScript;
    setSyncStatus('saved', 'Loaded ✓');
    setTimeout(function() { setSyncStatus('', 'Synced'); }, 2000);
  }

  function pollServer() {
    fetch('/api/teleprompter').then(function(r) { return r.json(); }).then(function(data) {
      var serverScript = data.script || '';
      if (serverScript !== lastRemoteScript) {
        lastRemoteScript = serverScript;
        var timeSinceEdit = Date.now() - lastLocalEditTs;
        // auto-update if user hasn't typed in 15s and textarea not focused
        if (timeSinceEdit > 15000 && document.activeElement !== scriptInput) {
          scriptInput.value = serverScript;
          if (data.speed) { speed = data.speed; speedSetup.value = data.speed; speedLive.value = data.speed; speedValEl.textContent = data.speed; localStorage.setItem('tp_speed', data.speed); }
          if (data.font_size) { fontSize = data.font_size; fontSetup.value = data.font_size; fontLive.value = data.font_size; fontValEl.textContent = data.font_size; localStorage.setItem('tp_font', data.font_size); }
          setSyncStatus('saved', 'Updated ✓');
          setTimeout(function() { setSyncStatus('', 'Synced'); }, 2000);
        } else if (serverScript !== scriptInput.value) {
          // show banner instead
          remoteBanner.style.display = 'block';
          setSyncStatus('remote', 'Remote update waiting');
        }
      }
    }).catch(function() {});
  }

  // ── Initial load ──
  setSyncStatus('', 'Loading…');
  fetch('/api/teleprompter').then(function(r) { return r.json(); }).then(function(data) {
    var s = data.script || '';
    lastRemoteScript = s;
    scriptInput.value = s;
    if (data.speed) { speed = data.speed; speedSetup.value = data.speed; speedLive.value = data.speed; speedValEl.textContent = data.speed; localStorage.setItem('tp_speed', data.speed); }
    if (data.font_size) { fontSize = data.font_size; fontSetup.value = data.font_size; fontLive.value = data.font_size; fontValEl.textContent = data.font_size; localStorage.setItem('tp_font', data.font_size); }
    setSyncStatus('saved', s ? 'Loaded ✓' : 'Ready');
    setTimeout(function() { setSyncStatus('', 'Synced'); }, 1500);
    pollTimer = setInterval(pollServer, 6000);
  }).catch(function() {
    setSyncStatus('', 'Offline mode');
    pollTimer = setInterval(pollServer, 6000);
  });

  // ── Textarea changes ──
  scriptInput.addEventListener('input', function() {
    lastLocalEditTs = Date.now();
    remoteBanner.style.display = 'none';
    clearTimeout(saveTimer);
    setSyncStatus('saving', 'Unsaved…');
    saveTimer = setTimeout(function() { saveScript(scriptInput.value); }, 2000);
  });

  // ── Setup sliders ──
  speedSetup.addEventListener('input', function() {
    speed = +this.value;
    speedValEl.textContent = this.value;
    speedLive.value = this.value;
    localStorage.setItem('tp_speed', this.value);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function() { saveScript(scriptInput.value); }, 1500);
  });

  fontSetup.addEventListener('input', function() {
    fontSize = +this.value;
    fontValEl.textContent = this.value;
    fontLive.value = this.value;
    localStorage.setItem('tp_font', this.value);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function() { saveScript(scriptInput.value); }, 1500);
  });

  // ── Live sliders ──
  speedLive.addEventListener('input', function() {
    speed = +this.value;
    speedSetup.value = this.value;
    localStorage.setItem('tp_speed', this.value);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function() { saveScript(scriptInput.value); }, 1500);
  });

  fontLive.addEventListener('input', function() {
    fontSize = +this.value;
    contentEl.style.fontSize = fontSize + 'px';
    fontSetup.value = this.value;
    localStorage.setItem('tp_font', this.value);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function() { saveScript(scriptInput.value); }, 1500);
  });

  // ── Start ──
  document.getElementById('startBtn').addEventListener('click', function() {
    var text = scriptInput.value.trim();
    if (!text) { scriptInput.focus(); return; }

    contentEl.textContent   = text;
    contentEl.style.fontSize = fontSize + 'px';
    scrollY  = 0;
    paused   = false;
    lastTs   = null;
    contentEl.style.transform = 'translateY(0px)';
    pausedLabel.style.display  = 'none';
    pauseBtn.textContent = '⏸ Pause';

    setupEl.style.display    = 'none';
    prompterEl.style.display = 'flex';

    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('portrait').catch(function(){});
    }

    startScroll();
    startRecording();
  });

  // ── Scroll loop ──
  function startScroll() {
    if (raf) cancelAnimationFrame(raf);
    lastTs = null;
    raf = requestAnimationFrame(tick);
  }

  function tick(ts) {
    if (!paused) {
      if (lastTs !== null) {
        scrollY += (speed / 1000) * (ts - lastTs) * 5;
        contentEl.style.transform = 'translateY(-' + scrollY + 'px)';
      }
      lastTs = ts;
    } else {
      lastTs = null;
    }
    raf = requestAnimationFrame(tick);
  }

  // ── Pause / resume ──
  function togglePause() {
    paused = !paused;
    pauseBtn.textContent     = paused ? '▶ Resume' : '⏸ Pause';
    pausedLabel.style.display = paused ? 'block' : 'none';
  }

  pauseBtn.addEventListener('click', togglePause);
  tapOverlay.addEventListener('click', togglePause);

  // ── Restart ──
  restartBtn.addEventListener('click', function() {
    scrollY = 0;
    lastTs  = null;
    contentEl.style.transform = 'translateY(0px)';
    if (paused) togglePause();
  });

  // ── Recording ──
  var mediaStream    = null;
  var mediaRecorder  = null;
  var recordedChunks = [];
  var recInterval    = null;
  var recSeconds     = 0;

  function getMimeType() {
    var types = ['video/mp4;codecs=h264,aac', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
    for (var i = 0; i < types.length; i++) {
      if (MediaRecorder.isTypeSupported(types[i])) return types[i];
    }
    return '';
  }

  function fmtTime(s) {
    return Math.floor(s/60) + ':' + ('0' + (s%60)).slice(-2);
  }

  function startRecording() {
    if (!document.getElementById('recordToggle').checked) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: true
    }).then(function(stream) {
      mediaStream = stream;

      var preview = document.getElementById('cameraPreview');
      preview.srcObject = stream;
      preview.style.display = 'block';
      preview.play();

      var opts = {};
      var mime = getMimeType();
      if (mime) opts.mimeType = mime;

      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream, opts);
      mediaRecorder.ondataavailable = function(e) {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };
      mediaRecorder.start(1000);

      document.getElementById('recIndicator').style.display = 'flex';
      recSeconds = 0;
      document.getElementById('recTimer').textContent = fmtTime(0);
      recInterval = setInterval(function() {
        recSeconds++;
        document.getElementById('recTimer').textContent = fmtTime(recSeconds);
      }, 1000);
    }).catch(function(err) {
      console.warn('Camera unavailable:', err);
    });
  }

  function stopRecording(saveAfter) {
    clearInterval(recInterval);
    document.getElementById('recIndicator').style.display = 'none';
    document.getElementById('cameraPreview').style.display = 'none';

    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.onstop = saveAfter ? showDownload : null;
      mediaRecorder.stop();
    }
    if (mediaStream) {
      mediaStream.getTracks().forEach(function(t) { t.stop(); });
      mediaStream = null;
    }
  }

  function showDownload() {
    if (!recordedChunks.length) return;
    var mime     = recordedChunks[0].type || 'video/mp4';
    var blob     = new Blob(recordedChunks, { type: mime });
    var ext      = mime.includes('mp4') ? 'mp4' : 'webm';
    var filename = 'recording-' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.' + ext;
    var file     = new File([blob], filename, { type: mime });

    // iOS 15+ — native share sheet lets them save directly to Photos
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'My recording' }).catch(function() {
        openBlobFallback(blob, filename);
      });
      goBackToSetup();
      return;
    }

    // Older iOS / desktop — open blob URL in new tab; Safari shows a Save button
    openBlobFallback(blob, filename);
    goBackToSetup();
  }

  function openBlobFallback(blob, filename) {
    var url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  }

  function goBackToSetup() {
    prompterEl.style.display = 'none';
    setupEl.style.display    = 'flex';
  }

  // toggle preview visibility on tap
  document.getElementById('cameraPreview').addEventListener('click', function() {
    this.style.opacity = this.style.opacity === '0' ? '1' : '0';
  });

  // ── Stop / back to edit ──
  stopBtn.addEventListener('click', function() {
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      stopRecording(true);  // showDownload -> share sheet -> goBackToSetup
    } else {
      goBackToSetup();
    }
  });
</script>
</body>
</html>
